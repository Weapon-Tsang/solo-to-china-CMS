<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <title>SoloToChina Research Engine</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" aria-label="SoloToChina dashboard">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" role="img"><path d="M14 3.2c5.97 0 10.8 4.83 10.8 10.8S19.97 24.8 14 24.8 3.2 19.97 3.2 14 8.03 3.2 14 3.2Z"/><path d="M8.8 16.5c2.1-1.34 3.52-3.51 4.25-6.5.9 2.22 2.03 3.91 3.4 5.07 1.2 1.02 2.12 2.13 2.75 3.33"/></svg>
          </span>
          <span>SoloToChina</span>
          <span class="product-name">Research Engine</span>
        </a>
        <div class="topbar-actions">
          <div id="health" class="health" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="health-copy">Connecting</span>
          </div>
          <button id="refresh" class="icon-button" type="button" aria-label="Refresh dashboard" title="Refresh dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M18.1 16A7 7 0 1 1 19 8.3L20 11"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="workspace-heading" aria-labelledby="workspace-title">
        <div>
          <p class="eyebrow">CONTENT INTELLIGENCE</p>
          <h1 id="workspace-title">Research sources</h1>
          <p id="workspace-description" class="workspace-description">Capture and trace every human-selected travel source.</p>
        </div>
        <div class="capture-state"><span aria-hidden="true">●</span> Capture service ready</div>
      </section>

      <section id="metrics" class="metrics" aria-label="Pipeline overview"></section>

      <div class="view-shell">
        <nav class="tabs" aria-label="Workspace views" role="tablist">
          <button class="tab active" type="button" role="tab" aria-selected="true" data-view="sources">Sources</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="knowledge">Knowledge</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="blueprints">Blueprints</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="content">Content</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="wordpress">WordPress</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="commercial">Offers</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="exceptions">Exceptions</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="maintenance">Maintenance</button>
        </nav>

        <section id="notice" class="notice hidden" aria-live="polite"></section>
        <section id="content" class="view-content" role="tabpanel" aria-live="polite">
          <div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>Loading workspace</span></div>
        </section>
      </div>
    </main>

    <dialog id="detail-dialog">
      <button class="close" type="button" aria-label="Close details">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
      </button>
      <div id="detail"></div>
    </dialog>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
