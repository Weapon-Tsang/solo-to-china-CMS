<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #17231e; }
      body { width: 340px; margin: 0; padding: 18px; background: #f6f4ed; }
      .eyebrow { margin: 0 0 4px; color: #176b50; font-size: 10px; font-weight: 800; letter-spacing: .13em; }
      h1 { margin: 0 0 6px; font-family: Georgia, serif; font-size: 25px; font-weight: 500; }
      p { margin: 0 0 15px; color: #65726b; font-size: 12px; line-height: 1.5; }
      button { position: relative; width: 100%; min-height: 44px; border: 0; border-radius: 9px; background: #176b50; color: white; font: inherit; font-weight: 720; cursor: pointer; transition: transform .18s ease, background .18s ease, box-shadow .18s ease; }
      button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(23, 107, 80, .2); }
      button:disabled { opacity: .55; cursor: wait; }
      button.is-saving::after { content: ""; display: inline-block; width: 11px; height: 11px; margin-left: 8px; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; vertical-align: -1px; animation: spin .7s linear infinite; }
      button.is-success { background: #0f8a63; animation: saved .55s ease both; }
      #status { min-height: 0; margin: 0; font-size: 12px; }
      #status.error { color: #b42318; } #status.success { color: #176b50; }
      #feedback { display: none; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 11px 12px; border: 1px solid #c9e8d9; border-radius: 10px; background: #eefaf4; color: #175c45; box-shadow: 0 4px 12px rgba(23, 107, 80, .08); }
      #feedback.visible { display: flex; animation: reveal .22s ease both; }
      #feedback.working { border-color: #c9d9ef; background: #f1f6fd; color: #2b5c94; }
      #feedback.warning { border-color: #f2d28d; background: #fff8e8; color: #8a5c0c; }
      #feedback.error { border-color: #f0c6c0; background: #fff2f0; color: #a33b31; }
      .feedback-icon { display: grid; width: 22px; height: 22px; flex: 0 0 22px; place-items: center; border-radius: 50%; background: currentColor; color: white; font-size: 13px; font-weight: 800; }
      .feedback-copy { min-width: 0; }
      .feedback-copy strong { display: block; font-size: 12px; line-height: 1.3; }
      .feedback-copy span { display: block; margin-top: 2px; color: inherit; font-size: 11px; line-height: 1.4; opacity: .85; }
      details { margin-top: 16px; padding-top: 12px; border-top: 1px solid #d9ddd8; }
      summary { color: #65726b; font-size: 11px; cursor: pointer; }
      label { display: block; margin-top: 10px; color: #4b5952; font-size: 11px; }
      input { width: 100%; margin-top: 4px; padding: 8px; border: 1px solid #ccd3ce; border-radius: 6px; background: white; font: inherit; font-size: 11px; box-sizing: border-box; }
      .save-settings { min-height: 34px; margin-top: 10px; background: #43574e; font-size: 11px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes saved { 50% { transform: scale(1.015); } 100% { transform: scale(1); } }
    </style>
  </head>
  <body>
    <p class="eyebrow">HUMAN-SELECTED CAPTURE</p>
    <h1>SoloToChina</h1>
    <p>Saves only the Xiaohongshu note you opened. No search, pagination, cookies, or account automation.</p>
    <button id="save">Save current note</button>
    <div id="status" role="status"></div>
    <section id="feedback" aria-live="polite" aria-atomic="true">
      <span id="feedback-icon" class="feedback-icon">✓</span>
      <div class="feedback-copy"><strong id="feedback-title"></strong><span id="feedback-detail"></span></div>
    </section>
    <details id="connection-settings">
      <summary>Connection settings</summary>
      <label>Engine URL<input id="endpoint" type="url" value="http://127.0.0.1:4310"></label>
      <label>Capture token<input id="token" type="password" autocomplete="off"></label>
      <button id="save-settings" class="save-settings">Save settings</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
